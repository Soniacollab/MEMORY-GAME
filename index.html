<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<title>Arcade Memory</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<div class="bg" aria-hidden="true"><div class="bgArt" aria-hidden="true"></div></div>
		<div class="grain" aria-hidden="true"></div>

		<main class="shell">
			<header class="top">
				<div class="brand">
					<div class="sigil" aria-hidden="true"></div>
					<div>
						<h1>Arcade Memory</h1>
						<p class="subtitle">Retrouve les paires. Pas de pitié.</p>
					</div>
				</div>

				<section class="hud" aria-label="Statistiques">
					<div class="stat">
						<div class="label">Temps</div>
						<div class="value" id="time">00:00</div>
					</div>
					<div class="stat">
						<div class="label">Coups</div>
						<div class="value" id="moves">0</div>
					</div>
					<div class="stat">
						<div class="label">Paires</div>
						<div class="value"><span id="pairs">0</span>/<span id="pairsTotal">0</span></div>
					</div>
					<div class="stat">
						<div class="label">Meilleur</div>
						<div class="value" id="best">—</div>
					</div>
				</section>
			</header>

			<section class="panel">
				<div class="panelTop">
					<div class="msg" id="msg" role="status" aria-live="polite"></div>
					<div class="controls">
						<button class="btn" id="restart" type="button">Recommencer</button>
					</div>
				</div>

				<div class="board" id="board" aria-label="Plateau de jeu"></div>

				<footer class="foot">
					<div class="hint">Astuce : observe les reflets, pas seulement l’image.</div>
					<p>Créé par <a href="https://github.com/Soniacollab/" target="_blank" rel="noopener">Sokhna Ndione</a></p>
				</footer>
			</section>
		</main>

		<script src="js/utils.js" defer></script>
		<script src="js/storage.js" defer></script>
		<script src="js/memoryGame.js" defer></script>
		<script src="js/script.js" defer></script>
	</body>
</html>
